<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인 - 판다마켓</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700&display=swap" rel="stylesheet"/>
  <!-- CSS 파일들 -->
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="global.css">
</head>
<body class="page-container">
  <!-- 상단 메뉴 -->
  <nav class="header-nav">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <img src="images/pandalogo.png" alt="판다마켓 로고">
      </a>
      <a href="login.html" class="login-button">로그인</a>
    </div>
  </nav>

  <!-- 메인 컨텐츠 -->
  <main class="main-content center-container">
    <div class="form-container">
      <!-- 로고 -->
      <div class="form-logo">
        <img src="images/pandalogo.png" alt="판다 로고">
      </div>

      <!-- 폼 -->
      <form id="login-form">
        <div class="input-group">
          <label for="email" class="input-label">이메일</label>
          <input id="email" type="email" class="text-input" placeholder="이메일을 입력해주세요" required />
        </div>

        <div class="input-group">
          <label for="password" class="input-label">비밀번호</label>
          <div class="password-container">
            <input id="password" type="password" class="text-input" placeholder="비밀번호를 입력해주세요" required />
            <button type="button" id="password-toggle" class="password-toggle-button">👁</button>
          </div>
        </div>

        <button type="submit" id="login-submit-button" class="submit-button">로그인</button>
      </form>

      <!-- 간편 로그인 -->
      <div class="social-login-bar">
        <span class="social-login-text">간편 로그인하기</span>
        <div class="social-icons-container">
          <a class="social-icon-link google" href="https://www.google.com/" target="_blank">G</a>
          <a class="social-icon-link kakao" href="https://www.kakaocorp.com/page/" target="_blank">K</a>
        </div>
      </div>

      <!-- 하단 링크 -->
      <div class="bottom-navigation-link">
        판다마켓이 처음이신가요? <a href="signup.html">회원가입</a>
      </div>
    </div>
  </main>

  <script>
    const email = document.getElementById('email');
    const pwd = document.getElementById('password');
    const btn = document.getElementById('login-submit-button');
    const tog = document.getElementById('password-toggle');
    const form = document.getElementById('login-form');

    // 버튼 활성화 함수
    function updateBtn() {
      const ok = email.value.trim() || pwd.value.trim();
      if (ok) {
        btn.classList.add('active');
        btn.disabled = false;
      } else {
        btn.classList.remove('active');
        btn.disabled = true;
      }
    }
    updateBtn();
    email.addEventListener('input', updateBtn);
    pwd.addEventListener('input', updateBtn);

    // 비밀번호 보기/숨기기
    tog.addEventListener('click', () => {
      const p = pwd.type === 'password';
      pwd.type = p ? 'text' : 'password';
      tog.textContent = p ? '🙈' : '👁';
    });

    // 폼 제출
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!btn.classList.contains('active')) return;
      alert('로그인 기능은 아직 구현되지 않았습니다.');
      location.href = 'index.html';
    });
  </script>
</body>
</html>
