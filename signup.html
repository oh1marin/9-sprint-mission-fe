<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>회원가입 - 판다마켓</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700&display=swap" rel="stylesheet"/>
    <!-- CSS 파일들 -->
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="global.css">
</head>
<body class="page-container">
    <!-- 상단 메뉴 -->
    <nav class="header-nav">
        <div class="nav-container">
            <a href="/" class="brand-logo">
                <img src="images/pandalogo.png" alt="판다마켓 로고">
            </a>
            <a href="login.html" class="login-button">로그인</a>
        </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <main class="main-content center-container">
        <div class="form-container">
            <!-- 로고 -->
            <div class="form-logo">
                <img src="images/pandalogo.png" alt="판다 로고">
            </div>

            <!-- 폼 -->
            <form id="signup-form">
                <div class="input-group">
                    <label for="email" class="input-label">이메일</label>
                    <input id="email" type="email" class="text-input" placeholder="이메일을 입력해주세요" required />
                </div>

                <div class="input-group">
                    <label for="nickname" class="input-label">닉네임</label>
                    <input id="nickname" type="text" class="text-input" placeholder="닉네임을 입력해주세요" required />
                </div>

                <div class="input-group">
                    <label for="password" class="input-label">비밀번호</label>
                    <div class="password-container">
                        <input id="password" type="password" class="text-input" placeholder="비밀번호를 입력해주세요" required />
                        <button type="button" id="password-toggle" class="password-toggle-button">👁</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password-confirm" class="input-label">비밀번호 확인</label>
                    <div class="password-container">
                        <input id="password-confirm" type="password" class="text-input" placeholder="비밀번호를 다시 입력해주세요" required />
                        <button type="button" id="password-confirm-toggle" class="password-toggle-button">👁</button>
                    </div>
                </div>

                <button type="submit" id="signup-submit-button" class="submit-button">회원가입</button>
            </form>

            <!-- 간편 회원가입 -->
            <div class="social-login-bar">
                <span class="social-login-text">간편 회원가입하기</span>
                <div class="social-icons-container">
                    <a class="social-icon-link google" href="https://www.google.com/" target="_blank">G</a>
                    <a class="social-icon-link kakao" href="https://www.kakaocorp.com/page/" target="_blank">K</a>
                </div>
            </div>

            <!-- 하단 링크 -->
            <div class="bottom-navigation-link">
                이미 회원이신가요? <a href="login.html">로그인</a>
            </div>
        </div>
    </main>

    <!-- 유효성 검증 모듈과 모달 모듈 -->
    <script src="validation.js"></script>
    <script src="modal.js"></script>
    <script>
        const email = document.getElementById('email');
        const nickname = document.getElementById('nickname');
        const pwd = document.getElementById('password');
        const pwd2 = document.getElementById('password-confirm');
        const btn = document.getElementById('signup-submit-button');
        const form = document.getElementById('signup-form');

        const togglePwd = document.getElementById('password-toggle');
        const togglePwd2 = document.getElementById('password-confirm-toggle');

        // 이메일 유효성 검증
        function validateEmailField() {
            const emailValue = email.value.trim();
            
            if (!emailValue) {
                showError(email, '이메일을 입력해주세요.');
                return false;
            }
            
            if (!validateEmail(emailValue)) {
                showError(email, '잘못된 이메일 형식입니다');
                return false;
            }
            
            clearError(email);
            return true;
        }

        // 비밀번호 유효성 검증
        function validatePasswordField() {
            const passwordValue = pwd.value.trim();
            
            if (!passwordValue) {
                showError(pwd, '비밀번호를 입력해주세요.');
                return false;
            }
            
            if (!validatePassword(passwordValue)) {
                showError(pwd, '비밀번호를 8자 이상 입력해주세요.');
                return false;
            }
            
            clearError(pwd);
            return true;
        }

        // 비밀번호 확인 유효성 검증
        function validatePasswordConfirmField() {
            const confirmValue = pwd2.value.trim();
            const passwordValue = pwd.value.trim();
            
            if (!confirmValue) {
                showError(pwd2, '비밀번호 확인을 입력해주세요.');
                return false;
            }
            
            if (confirmValue !== passwordValue) {
                showError(pwd2, '비밀번호가 일치하지 않습니다.');
                return false;
            }
            
            clearError(pwd2);
            return true;
        }

        // 버튼 상태 업데이트
        function updateBtnState() {
            const formContainer = document.querySelector('.form-container');
            const fieldsValid = areFieldsFilled([email, nickname, pwd, pwd2]) && !hasErrors(formContainer);
            updateButtonState(btn, fieldsValid);
        }

        // 이벤트 리스너 등록 - 이메일
        email.addEventListener('blur', () => {
            validateEmailField();
            updateBtnState();
        });

        email.addEventListener('input', () => {
            if (email.classList.contains('error')) {
                validateEmailField();
            }
            updateBtnState();
        });

        // 이벤트 리스너 등록 - 닉네임
        nickname.addEventListener('input', updateBtnState);

        // 이벤트 리스너 등록 - 비밀번호
        pwd.addEventListener('blur', () => {
            validatePasswordField();
            // 비밀번호 확인 필드도 다시 검증 (비밀번호가 변경된 경우)
            if (pwd2.value.trim()) {
                validatePasswordConfirmField();
            }
            updateBtnState();
        });

        pwd.addEventListener('input', () => {
            if (pwd.classList.contains('error')) {
                validatePasswordField();
            }
            // 비밀번호 확인 필드도 다시 검증
            if (pwd2.value.trim() && pwd2.classList.contains('error')) {
                validatePasswordConfirmField();
            }
            updateBtnState();
        });

        // 이벤트 리스너 등록 - 비밀번호 확인
        pwd2.addEventListener('blur', () => {
            validatePasswordConfirmField();
            updateBtnState();
        });

        pwd2.addEventListener('input', () => {
            if (pwd2.classList.contains('error')) {
                validatePasswordConfirmField();
            }
            updateBtnState();
        });

        // 비밀번호 보기/숨기기 함수
        function bindToggle(buttonEl, inputEl) {
            buttonEl.addEventListener('click', () => {
                const p = inputEl.type === 'password';
                inputEl.type = p ? 'text' : 'password';
                buttonEl.textContent = p ? '🙈' : '👁';
            });
        }

        bindToggle(togglePwd, pwd);
        bindToggle(togglePwd2, pwd2);

        // 폼 제출
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // 모든 필드 유효성 검증
            const emailValid = validateEmailField();
            const passwordValid = validatePasswordField();
            const confirmValid = validatePasswordConfirmField();
            
            if (!emailValid || !passwordValid || !confirmValid) {
                return;
            }
            
            const emailValue = email.value.trim();
            
            // 이메일 중복 확인
            if (checkEmailExists(emailValue)) {
                showModal('사용 중인 이메일입니다');
                return;
            }
            
            // 회원가입 성공 시 로그인 페이지로 이동
            window.location.href = 'login.html';
        });

        // 초기 버튼 상태 설정
        updateBtnState();
    </script>
</body>
</html>
