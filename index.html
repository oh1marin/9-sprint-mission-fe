<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS 파일들 -->
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="global.css">
    <style>
        /* 메인 페이지만의 스타일 */
        .hero-section {
            background: #BFDBFE;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            margin-top: 70px;
        }
        
        .hero-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 히어로 이미지 링크 */
        .hero-image-link {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        
        .hero-image-link:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        
        .hero-image-link img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 일반 섹션들 */
        .content-section {
            padding: 138px 0;
            max-width: 1200px;
            margin: 0 auto;
            background: #FFFFFF;
        }
        
        .section-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 32px;
        }
        
        .section-image {
            width: 100%;
            max-width: 988px;
            height: 444px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 트러스트 섹션 */
        .trust-section {
            background: #BFDBFE;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 트러스트 섹션 이미지 크기 조정 */
        .trust-section .section-image {
            width: 100%;
            max-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trust-section .section-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-width: none;
            max-height: none;
        }

        /* 푸터 */
        .footer {
            background: #111827;
            padding: 32px 0;
        }
        
        .footer-container {
            max-width: 1920px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 200px;
        }
        
        .footer-text, .footer-links a {
            color: #9CA3AF;
            font-size: 16px;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .footer-links {
            display: flex;
            gap: 30px;
        }
        
        .footer-links a:hover { 
            color: #D1D5DB; 
        }
        
        .footer-social-icons {
            display: flex;
            gap: 12px;
        }
        
        .footer-social-button {
            display: flex;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #374151;
            align-items: center;
            justify-content: center;
            color: #9CA3AF;
            text-decoration: none;
            font-size: 20px;
            transition: background-color 0.2s, color 0.2s;
        }
        
        .footer-social-button:hover {
            background: #4B5563;
            color: #D1D5DB;
        }

        /* 이미지 공통 스타일 */
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 반응형 디자인 */
        @media (min-width: 1920px) {
            .hero-section, .trust-section {
                background: #BFDBFE;
                width: 100%;
            }
            .footer-container {
                max-width: 1520px;
                margin: 0 auto;
            }
            .content-section {
                max-width: 1520px;
            }
        }

        @media (max-width: 1919px) {
            .footer-container {
                padding: 0 200px;
                width: 100%;
            }
            .content-section {
                padding: 138px 32px;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 상단 메뉴 -->
    <nav class="header-nav">
        <div class="nav-container">
            <a href="/" class="brand-logo">
                <img src="images/pandalogo.png" alt="판다마켓 로고">
            </a>
            <a href="login.html" class="login-button">로그인</a>
        </div>
    </nav>

    <!-- 메인 섹션 -->
    <section class="hero-section">
        <div class="hero-content">
            <a href="items.html" class="hero-image-link">
                <img src="images/panda1.png" alt="판다마켓 메인 이미지">
            </a>
        </div>
    </section>

    <!-- 상품 섹션 -->
    <section class="content-section">
        <div class="section-inner">
            <div class="section-image">
                <img src="images/panda2.png" alt="상품 등록 이미지">
            </div>
        </div>
    </section>

    <!-- 검색 섹션 -->
    <section class="content-section">
        <div class="section-inner">
            <div class="section-image">
                <img src="images/panda3.png" alt="핫한 상품 이미지">
            </div>
        </div>
    </section>

    <!-- 거래 섹션 -->
    <section class="content-section">
        <div class="section-inner">
            <div class="section-image">
                <img src="images/panda4.png" alt="판매 등록 이미지">
            </div>
        </div>
    </section>

    <!-- 안전 섹션 -->
    <section class="trust-section">
        <div class="hero-content">
            <div class="section-image">
                <img src="images/panda5.png" alt="안전거래 이미지">
            </div>
        </div>
    </section>

    <!-- 푸터 -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-text">©codeit - 2024</div>
            <div class="footer-links">
                <a href="privacy.html">Privacy Policy</a>
                <a href="faq.html">FAQ</a>
            </div>
            <div class="footer-social-icons">
                <a href="https://facebook.com" target="_blank" class="footer-social-button" title="Facebook">F</a>
                <a href="https://twitter.com" target="_blank" class="footer-social-button" title="Twitter">T</a>
                <a href="https://youtube.com" target="_blank" class="footer-social-button" title="YouTube">Y</a>
                <a href="https://instagram.com" target="_blank" class="footer-social-button" title="Instagram">I</a>
            </div>
        </div>
    </footer>

    <script>
        // 부드러운 스크롤 기능
        document.addEventListener('DOMContentLoaded', function() {
            const links = document.querySelectorAll('a[href^="#"]');
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
