<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>중고마켓 - 판다마켓</title>

    <!-- 카카오톡, 페이스북 등에 공유할 때 보이는 정보 -->
    <meta property="og:title" content="중고마켓 - 판다마켓" />
    <meta property="og:description" content="다양한 중고 상품을 거래해보세요" />
    <meta property="og:image" content="https://mellifluous-empanada-fa5948.netlify.app/images/pandalogo.png" />
    <meta property="og:url" content="https://mellifluous-empanada-fa5948.netlify.app/market.html" />
    <meta property="og:type" content="website" />

    <!-- 글꼴과 스타일시트 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/pages/market.css" />
  </head>

  <body>
    <!-- 상단 메뉴바 -->
    <nav class="header-nav">
      <div class="nav-container">
        <a href="index.html" class="brand-logo">
          <img src="../images/pandalogo.png" alt="판다마켓 로고" />
        </a>

        <div class="nav-menu-group">
          <a href="board.html" class="board-link">자유게시판</a>
          <a href="market.html" class="market-link active">중고마켓</a>
        </div>

        <div class="nav-right">
          <a href="login.html" class="login-button">로그인</a>
        </div>
      </div>
    </nav>

    <!-- 본문 내용 -->
    <main class="main-content">
      <!-- 베스트 상품 영역 -->
      <section class="best-products-section">
        <div class="container">
          <h2 class="section-title">베스트 상품</h2>
          <div id="best-products-container">
            <div class="loading">베스트 상품을 불러오고 있습니다...</div>
          </div>
        </div>
      </section>

      <!-- 전체 상품 영역 -->
      <section class="all-products-section">
        <div class="container">
          <div class="products-header">
            <h2 class="section-title">판매 중인 상품</h2>

            <!-- 검색창과 정렬 드롭다운 -->
            <div class="products-controls">
              <div class="search-container">
                <input
                  id="search-input"
                  class="search-input"
                  type="text"
                  placeholder="검색할 상품을 입력해주세요"
                />
                <button id="search-button" class="search-button">🔍</button>
              </div>

              <select id="sort-select" class="sort-select" aria-label="정렬 방식 선택" title="상품 정렬 방식을 선택하세요">
                <option value="recent">최신 순</option>
                <option value="favorite">좋아요 순</option>
              </select>
            </div>
          </div>

          <!-- 상품 목록이 표시될 영역 -->
          <div id="all-products-container">
            <div class="loading">상품을 불러오고 있습니다...</div>
          </div>

          <!-- 페이지 번호 버튼들 -->
          <div id="pagination-container"></div>
        </div>
      </section>
    </main>

    <!-- 하단 푸터 -->
    <footer class="footer">
      <div class="footer-container">
        <div class="footer-text">©codeit - 2024</div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="faq.html">FAQ</a>
        </div>
        <div class="footer-social-icons">
          <a href="https://facebook.com" target="_blank" class="footer-social-button" title="Facebook">
            <img src="../images/facebook.png" alt="Facebook" width="20" height="20" />
          </a>
          <a href="https://twitter.com" target="_blank" class="footer-social-button" title="Twitter">
            <img src="../images/tw.png" alt="Twitter" width="20" height="20" />
          </a>
          <a href="https://youtube.com" target="_blank" class="footer-social-button" title="YouTube">
            <img src="../images/youtube.png" alt="YouTube" width="20" height="20" />
          </a>
          <a href="https://instagram.com" target="_blank" class="footer-social-button" title="Instagram">
            <img src="../images/insta.png" alt="Instagram" width="20" height="20" />
          </a>
        </div>
      </div>
    </footer>

    <script>
      // 상품 관리 클래스
      class ProductsManager {
        constructor() {
          this.currentPage = 1;              // 현재 페이지 번호
          this.pageSize = this.getPageSize(); // 한 페이지에 보여줄 상품 개수
          this.orderBy = "recent";            // 정렬 방식 (최신순/좋아요순)
          this.keyword = "";                  // 검색어
          this.products = [];                 // 불러온 상품 목록
          this.totalCount = 0;                // 전체 상품 개수
          this.loading = false;               // 로딩 중인지 여부
          this.error = null;                  // 에러 메시지

          // 화면 크기가 바뀌면 페이지 크기도 변경
          window.addEventListener("resize", () => {
            const newPageSize = this.getPageSize();
            if (newPageSize !== this.pageSize) {
              this.pageSize = newPageSize;
              this.currentPage = 1;
              this.loadProducts();
            }
          });
        }

        // 화면 크기에 따라 한 페이지에 보여줄 상품 개수 계산
        getPageSize() {
          const width = window.innerWidth;
          if (width >= 1200) return 10; // PC: 5열 x 2행
          if (width >= 744) return 6;   // 태블릿: 3열 x 2행
          return 4;                     // 모바일: 2열 x 2행
        }

        // 서버에서 상품 목록 가져오기
        async loadProducts() {
          this.loading = true;
          this.error = null;
          this.updateProductsUI();

          try {
            // API 요청 URL 만들기
            const params = new URLSearchParams({
              page: this.currentPage.toString(),
              pageSize: this.pageSize.toString(),
              orderBy: this.orderBy,
            });

            if (this.keyword.trim()) {
              params.append("keyword", this.keyword.trim());
            }

            // 서버에서 데이터 받아오기
            const response = await fetch(
              `https://panda-market-api.vercel.app/products?${params}`
            );
            if (!response.ok) throw new Error("네트워크 오류가 발생했습니다.");

            const data = await response.json();
            this.products = data.list || [];
            this.totalCount = data.totalCount || 0;
          } catch (err) {
            this.error = err.message;
            this.products = [];
            this.totalCount = 0;
          } finally {
            this.loading = false;
            this.updateProductsUI();
            this.updatePaginationUI();
          }
        }

        // 상품 목록 화면 업데이트
        updateProductsUI() {
          const container = document.getElementById("all-products-container");

          // 로딩 중일 때
          if (this.loading) {
            container.innerHTML = '<div class="loading">상품을 불러오고 있습니다...</div>';
            return;
          }
          // 에러가 발생했을 때
          if (this.error) {
            container.innerHTML = `<div class="error">오류가 발생했습니다: ${this.error}</div>`;
            return;
          }
          // 상품이 없을 때
          if (this.products.length === 0) {
            container.innerHTML = '<div class="no-products">등록된 상품이 없습니다.</div>';
            return;
          }

          // 상품 카드 HTML 만들기
          const productsHTML = this.products
            .map((product) => this.createProductCard(product))
            .join("");
          container.innerHTML = `<div class="products-grid">${productsHTML}</div>`;
        }

        // 페이지 번호 버튼 업데이트
        updatePaginationUI() {
          const container = document.getElementById("pagination-container");
          const totalPages = Math.ceil(this.totalCount / this.pageSize);

          // 페이지가 1개뿐이면 버튼 숨기기
          if (totalPages <= 1) {
            container.innerHTML = "";
            return;
          }

          // 보여줄 페이지 번호 계산 (최대 5개)
          const maxVisible = 5;
          let start = Math.max(1, this.currentPage - Math.floor(maxVisible / 2));
          let end = Math.min(totalPages, start + maxVisible - 1);

          if (end - start + 1 < maxVisible) {
            start = Math.max(1, end - maxVisible + 1);
          }

          const visiblePages = Array.from({ length: end - start + 1 }, (_, i) => start + i);

          // 페이지 번호 버튼 HTML 만들기
          const paginationHTML = `
            <div class="pagination">
              <button class="pagination-btn" onclick="productsManager.goToPage(${this.currentPage - 1})" ${
            this.currentPage === 1 ? "disabled" : ""
          }>
                이전
              </button>
              ${visiblePages
                .map(
                  (page) => `
                <button
                  class="pagination-btn ${page === this.currentPage ? "active" : ""}"
                  onclick="productsManager.goToPage(${page})"
                >
                  ${page}
                </button>
              `
                )
                .join("")}
              <button class="pagination-btn" onclick="productsManager.goToPage(${this.currentPage + 1})" ${
            this.currentPage === totalPages ? "disabled" : ""
          }>
                다음
              </button>
            </div>
          `;

          container.innerHTML = paginationHTML;
        }

        // 상품 카드 HTML 만들기
        createProductCard(product) {
          const imageUrl =
            product.images && product.images.length > 0
              ? product.images[0]
              : "https://via.placeholder.com/200x200?text=No+Image";

          return `
            <div class="product-card">
              <div class="product-image">
                <img src="${imageUrl}" alt="${product.name || "상품 이미지"}" />
              </div>
              <div class="product-info">
                <h3 class="product-name">${product.name || "제목 없음"}</h3>
                <p class="product-price">${this.formatPrice(product.price)}</p>
                <div class="product-meta">
                  <span class="product-favorite">♥ ${product.favoriteCount || 0}</span>
                  <span class="product-date">${this.formatDate(product.createdAt)}</span>
                </div>
              </div>
            </div>
          `;
        }

        // 가격을 한국 원화 형식으로 변환 
        formatPrice(price) {
          if (!price) return "0원";
          return new Intl.NumberFormat("ko-KR").format(price) + "원";
        }

        // 날짜를 상대적 시간으로 변환 
        formatDate(dateString) {
          if (!dateString) return "";
          const date = new Date(dateString);
          const now = new Date();
          const diff = now - date;
          const hours = Math.floor(diff / (1000 * 60 * 60));

          if (hours < 24) {
            return hours < 1 ? "방금 전" : `${hours}시간 전`;
          }
          const days = Math.floor(hours / 24);
          return `${days}일 전`;
        }

        // 특정 페이지로 이동
        goToPage(page) {
          this.currentPage = page;
          this.loadProducts();
        }

        // 검색 실행
        search(keyword) {
          this.keyword = keyword;
          this.currentPage = 1;
          this.loadProducts();
        }

        // 정렬 방식 변경
        sort(orderBy) {
          this.orderBy = orderBy;
          this.currentPage = 1;
          this.loadProducts();
        }
      }

      // ===========================
      // 베스트 상품 관리 클래스
      // - 좋아요가 많은 상품 4개 표시
      // ===========================
      class BestProductsManager {
        constructor() {
          this.bestProducts = [];
          this.loading = false;
        }

        // 베스트 상품 4개 가져오기
        async loadBestProducts() {
          this.loading = true;
          this.updateBestProductsUI();

          try {
            const response = await fetch(
              "https://panda-market-api.vercel.app/products?orderBy=favorite&pageSize=4"
            );
            if (response.ok) {
              const data = await response.json();
              this.bestProducts = data.list || [];
            }
          } catch (err) {
            console.error("베스트 상품 조회 실패:", err);
            this.bestProducts = [];
          } finally {
            this.loading = false;
            this.updateBestProductsUI();
          }
        }

        // 베스트 상품 화면 업데이트
        updateBestProductsUI() {
          const container = document.getElementById("best-products-container");

          if (this.loading) {
            container.innerHTML = '<div class="loading">베스트 상품을 불러오고 있습니다...</div>';
            return;
          }

          const productsHTML = this.bestProducts
            .map((product) => productsManager.createProductCard(product))
            .join("");
          container.innerHTML = `<div class="best-products-grid">${productsHTML}</div>`;
        }
      }

      // ===========================
      // 전역 변수로 관리 객체 생성
      // ===========================
      const productsManager = new ProductsManager();
      const bestProductsManager = new BestProductsManager();

      // ===========================
      // 페이지 로드 시 초기 설정
      // ===========================
      document.addEventListener("DOMContentLoaded", function () {
        // 베스트 상품과 전체 상품 불러오기
        bestProductsManager.loadBestProducts();
        productsManager.loadProducts();

        // 검색 기능 설정
        const searchInput = document.getElementById("search-input");
        const searchButton = document.getElementById("search-button");
        const handleSearch = () => productsManager.search(searchInput.value);
        searchButton.addEventListener("click", handleSearch);
        searchInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") handleSearch();
        });

        // 정렬 기능 설정
        const sortSelect = document.getElementById("sort-select");
        sortSelect.addEventListener("change", (e) => {
          productsManager.sort(e.target.value);
        });
      });
    </script>
  </body>
</html>
