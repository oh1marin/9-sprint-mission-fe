    <link rel="stylesheet" href="../css/reset.css" />

  <body>

      <div class="hero-content">
        <a href="market.html" class="hero-image-link" aria-label="중고마켓으로 이동">
          <img src="../images/panda1.png" alt="판다마켓 메인 이미지" />

    <!-- 상품 섹션 -->

    <!-- 푸터 -->

      <div class="footer-container">
        <div class="footer-text">©codeit - 2024</div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>

        </div>

          <a href="https://facebook.com" target="_blank" class="footer-social-button" title="Facebook">

          </a>
          <a href="https://twitter.com" target="_blank" class="footer-social-button" title="Twitter">

      </div>
    </footer>

    <script>
      // 부드러운 스크롤 (해시 링크가 있을 경우)
      document.addEventListener("DOMContentLoaded", function () {
        const links = document.querySelectorAll('a[href^="#"]');
        links.forEach((link) => {
          link.addEventListener("click", function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute("href"));
            if (target) {
              target.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
        });
      });
    </script>
  </body>
